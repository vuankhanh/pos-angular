<div class="container">
  <section>
    <div class="group-button-row">
      <button mat-raised-button color="primary" (click)="onCreateEvent()">
        <mat-icon>add</mat-icon>
        Thêm đơn hàng
      </button>
    </div>
  </section>
  @if (purchaseOrders) {
    <section class="table-container mat-elevation-z8" tabindex="0">
      <table mat-table [dataSource]="purchaseOrders" class="mat-elevation-z8">

        <ng-container matColumnDef="status" [sticky]="breakpointDetection$ | async">
          <th mat-header-cell *matHeaderCellDef> Trạng thái </th>
          <td mat-cell *matCellDef="let item">
            <app-status-color [status]="item.status"></app-status-color>
          </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef> Ngày tháng </th>
          <td mat-cell *matCellDef="let item">{{item.createdAt | date:'dd/MM/yyyy HH:mm:ss'}}</td>
        </ng-container>

        <ng-container matColumnDef="code">
          <th mat-header-cell *matHeaderCellDef> Mã </th>
          <td mat-cell *matCellDef="let item"> {{item.orderCode}} </td>
        </ng-container>
  
        <ng-container matColumnDef="totalPrice">
          <th mat-header-cell *matHeaderCellDef> Tổng tiền </th>
          <td mat-cell *matCellDef="let item"> {{item.totalPrice | vndCurrency}} </td>
        </ng-container>
  
        <!-- Action Column -->
        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef> Hành động </th>
          <td mat-cell *matCellDef="let element">
            <div class="action-group-button">
              <button mat-icon-button color="primary" (click)="onViewEvent(element)">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="onEditEvent(element)">
                <mat-icon>edit</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </section>
  }
  @if(pagination.totalItems){
  <mat-paginator [length]="pagination.totalItems" [pageIndex]="pagination.page - 1" [pageSize]="pagination.size"
    [pageSizeOptions]="pageSizeOptions" (page)="handlePageEvent($event)"></mat-paginator>
  }
</div>
