@if (supplier) {
  <mat-card>
    <mat-card-header>
      <div class="button-group-header">
        <div>
          <button mat-icon-button color="primary" (click)="goBackSupplierList()">
            <mat-icon>arrow_back</mat-icon>
          </button>
        </div>
        <div>
          <button mat-icon-button color="primary" (click)="editSupplier()">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteSupplier()">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>
    </mat-card-header>
    <mat-card-content>
      <mat-card-title>
      {{ supplier.name }}
    </mat-card-title>
      <mat-card class="mat-card-child">
        <mat-card-content>
          <mat-card-subtitle>Nhà cung cấp</mat-card-subtitle>
          <div class="list-item-container">
            <mat-icon>location_on</mat-icon>
            @if(supplier.address; as address) {
              <span>{{ address | address }}</span>
            }@else {
              <span class="additional-text-element" (click)="editSupplier('address')">Thêm số điện thoại</span>
            }
          </div>

          <div class="list-item-container">
            <mat-icon>phone</mat-icon>
            @if(supplier.telephone; as telephone) {
              <span>{{ telephone | phoneNumber }}</span>
            }@else {
              <span class="additional-text-element" (click)="editSupplier('telephone')">Thêm số điện thoại</span>
            }
          </div>
        </mat-card-content>
      </mat-card>
    </mat-card-content>
  </mat-card>
}
