@if (formGroup) {
<mat-card>
  <mat-card-header>
    <div class="button-group-header">
      <button mat-icon-button color="primary" (click)="goBackSupplierDetail()">
        <mat-icon>arrow_back</mat-icon>
      </button>
    </div>
  </mat-card-header>
  <mat-card-content>
    <mat-card-title>{{ supplierLocation?.name }}</mat-card-title>
    <form #customerEditForm [formGroup]="formGroup" (ngSubmit)="onSubmit()" class="container">
      <mat-form-field>
        <mat-icon matPrefix>contacts</mat-icon>
        <input #formElement matInput placeholder="Tên" formControlName="name">
        <mat-error *ngIf="formGroup.get('name')!.hasError('required')">Tên không được để trống</mat-error>
      </mat-form-field>

      <app-address-selector [address]="addressControl.value" (addressValidChange)="onAddressValidChange($event)"
        (valueChange)="onAddressValueChange($event)"></app-address-selector>

      <mat-form-field>
        <mat-icon matPrefix>call</mat-icon>
        <input #formElement matInput placeholder="Số điện thoại" formControlName="telephone">
      </mat-form-field>

      <app-coordinate-selector [coordinate]="positionControl.value"
        (coordinateChange)="onCoordinateChange($event)"></app-coordinate-selector>

      <mat-form-field>
        <mat-icon matPrefix>mail</mat-icon>
        <input #formElement matInput placeholder="Email" formControlName="email">
      </mat-form-field>

      <app-bank-transfer [bankTransfer]="bankTransferControl.value" (bankTransferChange)="onBankTransferChange($event)" (bankTransferIsValidChange)="onBankTransferIsValidChange($event)"></app-bank-transfer>

    </form>
  </mat-card-content>
  <mat-card-actions>
    @if (supplierLocation?._id) {
    <button mat-raised-button color="primary" type="button" (click)="onSubmit()"
      [disabled]="formGroup.invalid || !(isFormChanged$ | async)">
      Lưu
    </button>
    }@else {
    <button mat-raised-button color="primary" type="button" (click)="onSubmit()" [disabled]="formGroup.invalid ">
      Tạo
    </button>
    }
  </mat-card-actions>
</mat-card>
}
