<h2 mat-dialog-title>Cập nhật công nợ</h2>
<mat-dialog-content>
  <form [formGroup]="formGroup">
    <mat-form-field>
      <mat-label>Số tiền</mat-label>
      <input
        matInput
        formControlName="amount"
        mask="separator.0"
        thousandSeparator="."
        [allowNegativeNumbers]="true"
        (blur)="onAmountBlur($event)"
      >
    </mat-form-field>

    <mat-form-field>
      <mat-label>Ghi chú</mat-label>
      <textarea
        matInput
        cdkTextareaAutosize
        formControlName="note"
        #autosize="cdkTextareaAutosize"
        cdkAutosizeMinRows="1"
        cdkAutosizeMaxRows="5"
      ></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button (click)="cancelAction()">Hủy</button>
  <button mat-button (click)="clearDebt()" cdkFocusInitial>Xóa công nợ</button>
  <button mat-button (click)="updateDebt()" cdkFocusInitial [disabled]="!(isFormChanged$ | async)">Cập nhật</button>
</mat-dialog-actions>
